<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gacha Forge Customizer V1 · 설정 설계</title><style>body{font-family:system-ui;background:#121927;color:#eff3ff;max-width:560px;margin:2em auto;padding:1em}section{background:#202b40;border-radius:16px;padding:1.1em;margin:1em 0}label{display:block;margin:.9em 0}input,select,button{padding:.65em;background:#101a2c;border:1px solid #7f91ad;border-radius:7px;color:white}button{background:#456cba;cursor:pointer}p{color:#bfcadd;font-size:.9em}</style><h1>Gacha Forge Customizer · V1</h1><p>서버에 연결하지 않는 설정 설계 도구입니다. 실제 게임 데이터나 천장 확률을 변경하지 않습니다.</p><section><label>배너 기간 <select id="days"><option>1</option><option selected>3</option><option>7</option><option>14</option></select> 일</label><label>캐릭터 천장 <input type="number" id="char" value="70" min="1" max="100"></label><label>무기 천장 <input type="number" id="weapon" value="60" min="1" max="100"></label><label>4성 풀돌 Glimmer <input type="number" id="dup4" value="8"></label><label>5성 풀돌 Glimmer <input type="number" id="dup5" value="40"></label><label>4성 정가 <input type="number" id="shop4" value="40"></label><label>5성 정가 <input type="number" id="shop5" value="200"></label><button id="copy">설정 JSON 복사</button></section><p id="msg"></p><script>document.getElementById('copy').onclick=async()=>{let v=id=>+document.getElementById(id).value;let x={bannerDays:v('days'),characterPity:v('char'),weaponPity:v('weapon'),characterFeaturedGuarantee:true,weaponFeaturedGuarantee:true,fullFacetGlimmer:{4:v('dup4'),5:v('dup5')},shopPrices:{4:v('shop4'),5:v('shop5')}};try{await navigator.clipboard.writeText(JSON.stringify(x,null,2));document.getElementById('msg').textContent='설정 복사 완료'}catch{document.getElementById('msg').textContent=JSON.stringify(x)}}</script></html>
